services:
  website:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        # Baked into the client bundle at build time — must match the runtime value.
        VITE_SOURCE_REPO: ${VITE_SOURCE_REPO:-dreamy-ui/dreamy-ui}
    environment:
      NODE_ENV: production
      PORT: 3000
      GITHUB_TOKEN: ${GITHUB_TOKEN:?GITHUB_TOKEN is required}
      VITE_SOURCE_REPO: ${VITE_SOURCE_REPO:-dreamy-ui/dreamy-ui}
      DATABASE_URL: ${DATABASE_URL:-file:./prisma/data.db}
      # Coolify generates SERVICE_PASSWORD_64_REDIS; locally run: node scripts/ensure-compose-env.mjs
      REDIS_URL: ${REDIS_URL:-redis://:${SERVICE_PASSWORD_64_REDIS}@redis:6379}
    depends_on:
      redis:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:3000"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s

  redis:
    image: redis:8-alpine
    restart: unless-stopped
    environment:
      REDIS_PASSWORD: ${SERVICE_PASSWORD_64_REDIS}
    healthcheck:
      test: ["CMD-SHELL", "export REDISCLI_AUTH=\"$$REDIS_PASSWORD\" && redis-cli ping | grep -q PONG"]
      interval: 5s
      timeout: 3s
      retries: 5
    volumes:
      - redis_data:/data

volumes:
  redis_data:
